# ReadTheDocs build configuration.
#
# Triggers an automatic rebuild on every push to the configured branch.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for the
# full reference.

version: 2

build:
  os:           ubuntu-24.04
  tools:
    python:     "3.12"
  jobs:
    pre_install:
      # Show the resolved git state in the build log — useful when
      # diagnosing "why is the live docs site not what I just pushed?"
      - git --no-pager log -1 --stat

sphinx:
  configuration: docs/conf.py
  builder:        html
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
    # NB: we deliberately do NOT ``pip install .`` the SKAVA project on
    # ReadTheDocs. The docs are pure Markdown / RST and reference the
    # codebase by URL only — no ``autodoc`` / ``automodule`` pulls happen
    # in the build. This lets the docs build on the SKAVA-www mirror
    # (which holds only the ``docs/`` subtree, no pyproject.toml).

formats:
  - pdf
  - epub
