{% extends "base.html" %}
{% block title %}Sign in — {{ brand.name }}{% endblock %}

{% block topbar %}{# no nav before login #}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow border border-slate-200 p-6 mt-12">
  <h1 class="text-xl font-semibold mb-1 text-brandDark">{{ brand.name }}</h1>
  <p class="text-sm text-slate-600 mb-6">Sign in to manage the data discovery catalog.</p>

  {% if error %}
    <div role="alert"
         class="border border-rose-300 bg-rose-50 text-rose-900 rounded px-4 py-2 mb-4 text-sm">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="/admin/login" class="space-y-4" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}" />
    <input type="hidden" name="next" value="{{ next }}" />

    <div>
      <label for="username" class="block text-sm font-medium text-slate-700 mb-1">
        Username
      </label>
      <input
        id="username" name="username" type="text" required autofocus
        autocomplete="username"
        value="{{ submitted_username|default('', true) }}"
        class="w-full border border-slate-300 rounded px-3 py-2
               focus:outline-none focus:ring-2 focus:ring-brand" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
        Password
      </label>
      <input
        id="password" name="password" type="password" required
        autocomplete="current-password"
        class="w-full border border-slate-300 rounded px-3 py-2
               focus:outline-none focus:ring-2 focus:ring-brand" />
    </div>

    <button type="submit"
            class="w-full bg-brand hover:bg-brandDark text-white rounded
                   px-4 py-2 font-medium transition">
      Sign in
    </button>
  </form>
</div>
{% endblock %}
