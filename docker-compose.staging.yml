services:
  postgres:
    image: postgres:16
    container_name: skava-postgres-staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skava}
      POSTGRES_USER: ${POSTGRES_USER:-skava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skava}
    volumes:
      - skava_pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skava} -d ${POSTGRES_DB:-skava}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - skava_internal

  skava-discovery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: skava-discovery-staging
    environment:
      SKAVA_ENV: staging
      SKAVA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skava}:${POSTGRES_PASSWORD:-skava}@postgres:5432/${POSTGRES_DB:-skava}
      SKAVA_PUBLIC_BASE_URL: ${SKAVA_PUBLIC_BASE_URL:-http://localhost}
      SKAVA_LOG_LEVEL: ${SKAVA_LOG_LEVEL:-INFO}
      SKAVA_DB_POOL_SIZE: ${SKAVA_DB_POOL_SIZE:-20}
      SKAVA_DB_MAX_OVERFLOW: ${SKAVA_DB_MAX_OVERFLOW:-30}
      SKAVA_DB_POOL_TIMEOUT: ${SKAVA_DB_POOL_TIMEOUT:-30}
      SKAVA_DB_POOL_RECYCLE: ${SKAVA_DB_POOL_RECYCLE:-1800}
      SKAVA_DB_CONNECT_RETRIES: ${SKAVA_DB_CONNECT_RETRIES:-20}
      SKAVA_DB_CONNECT_RETRY_DELAY: ${SKAVA_DB_CONNECT_RETRY_DELAY:-1.5}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - skava_internal

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: skava-nginx-staging
    depends_on:
      skava-discovery:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - skava_nginx_logs:/var/log/nginx
    networks:
      - skava_public
      - skava_internal

volumes:
  skava_pgdata_staging:
  skava_nginx_logs:

networks:
  skava_internal:
    driver: bridge
    internal: true
  skava_public:
    driver: bridge
