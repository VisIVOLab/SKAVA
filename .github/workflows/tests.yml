name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Caching pip across runs cuts ~30 s on every CI invocation;
          # safe because requirements pin exact versions.
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install project (editable) + dev extras
        run: |
          python -m pip install --upgrade pip
          # Install editable with the optional ``dev`` group if defined;
          # fall back to plain editable + a minimal test toolchain otherwise.
          pip install -e ".[dev]" 2>/dev/null \
            || pip install -e . pytest "httpx>=0.27" sqlalchemy

      - name: Run pytest
        env:
          SKAVA_DATABASE_URL: "sqlite+pysqlite:///:memory:"
          SKAVA_PUBLIC_BASE_URL: "http://testserver"
          SKAVA_ENV: "dev"
          INTERNAL_API_KEY: "ci-internal-key"
        run: pytest -v --tb=short
