worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;

  upstream skava_api {
    server skava-discovery:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # TLS termination can be added here by enabling listen 443 ssl and certificate directives.

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location / {
      limit_req zone=api_rate_limit burst=60 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";

      proxy_pass http://skava_api;
    }
  }
}
