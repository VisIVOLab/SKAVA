worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # nginx needs writable temp dirs; with a read-only rootfs these are tmpfs
  # mounts (see docker-compose.prod.yml).
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;                 # don't leak nginx version

  client_max_body_size 32m;          # bounded request bodies (ingestion uploads)

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Two rate-limit zones: a general API one and a stricter one for the admin UI.
  limit_req_zone $binary_remote_addr zone=api_rate_limit:10m   rate=30r/s;
  limit_req_zone $binary_remote_addr zone=admin_rate_limit:10m rate=5r/s;

  upstream skava_api {
    server skava-discovery:8000;
    keepalive 32;
  }

  # Security response headers are added per-server below. HSTS is set by the
  # TLS terminator in front (Caddy), where the connection is HTTPS.

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # ── /metrics: never exposed publicly ──────────────────────────────────
    # Prometheus should scrape skava-discovery:8000/metrics on the internal
    # Docker network, NOT through this public proxy.
    location = /metrics {
      deny all;
      return 403;
    }

    # ── /admin: tighter rate limit + optional IP allow-list ───────────────
    # Uncomment the allow/deny lines to restrict the admin UI to known
    # networks (e.g. your VPN/office). Leave open only if you rely on the
    # built-in auth (bcrypt + CSRF + secure session cookie) over HTTPS.
    location /admin {
      # allow 10.0.0.0/8;
      # allow 192.168.0.0/16;
      # deny all;
      limit_req zone=admin_rate_limit burst=10 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";
      proxy_pass http://skava_api;
    }

    location / {
      limit_req zone=api_rate_limit burst=60 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";

      proxy_pass http://skava_api;
    }
  }
}
