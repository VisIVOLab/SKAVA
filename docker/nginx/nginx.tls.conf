worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Writable temp dirs on tmpfs (read-only rootfs in docker-compose.selfhost-tls.yml).
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 32m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  limit_req_zone $binary_remote_addr zone=api_rate_limit:10m   rate=30r/s;
  limit_req_zone $binary_remote_addr zone=admin_rate_limit:10m rate=5r/s;

  upstream skava_api {
    server skava-discovery:8000;
    keepalive 32;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name visivo-server.oact.inaf.it;

    # Existing Let's Encrypt cert for this host (mounted read-only). Same
    # hostname as the gateway, different port → valid certificate.
    ssl_certificate     /etc/letsencrypt/live/visivo-server.oact.inaf.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visivo-server.oact.inaf.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # /metrics never exposed publicly — scrape skava-discovery:8000 internally.
    location = /metrics {
      deny all;
      return 403;
    }

    location /admin {
      # allow 192.168.0.0/16; deny all;   # optional IP allow-list
      limit_req zone=admin_rate_limit burst=10 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";
      proxy_pass http://skava_api;
    }

    location / {
      limit_req zone=api_rate_limit burst=60 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";
      proxy_pass http://skava_api;
    }
  }
}
