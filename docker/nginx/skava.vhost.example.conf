# SKAVA virtual host for the VisIVO Science Gateway's nginx-proxy.
#
# Paste the http-level lines + the server{} block into the existing host file
#   /home/visivosg/streamFlow/VisIVOScienceGateway/nginx/nginx.conf
# (limit_req_zone inside http{}, the server{} inside http{}), then:
#   docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
#
# Prerequisites:
#   * skava-discovery is on visivosciencegateway_airflow-net (the network the
#     nginx-proxy is on) — handled by docker-compose.shared-proxy.yml.
#   * DNS: skava.example.org → this server's public IP.
#   * A Let's Encrypt cert for skava.example.org under /etc/letsencrypt
#     (already mounted into nginx-proxy). See the cert command in the notes.

# This zone MUST live in the http{} context (top level), not inside server{}.
# If your nginx-proxy already defines rate-limit zones, just add these names.
limit_req_zone $binary_remote_addr zone=skava_api:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=skava_admin:10m rate=5r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name skava.example.org;

    ssl_certificate     /etc/letsencrypt/live/skava.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skava.example.org/privkey.pem;

    server_tokens off;
    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # /metrics is never exposed publicly — scrape skava-discovery:8000/metrics
    # on the internal Docker network instead.
    location = /metrics {
        deny all;
        return 403;
    }

    # Admin UI: stricter rate limit (+ optional IP allow-list).
    location /admin {
        # allow 10.0.0.0/8; deny all;
        limit_req zone=skava_admin burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://skava-discovery-staging:8000;
    }

    location / {
        limit_req zone=skava_api burst=60 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://skava-discovery-staging:8000;
    }
}

# Optional: redirect plain HTTP for this host to HTTPS. Only add if the
# existing nginx-proxy does not already have a catch-all :80 → :443 redirect.
